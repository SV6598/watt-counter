<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Watt-counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; min-height: 100vh; padding: 12px; max-width: 480px; margin: 0 auto; gap: 14px; }
    
    h1 { font-size: 1.3rem; color: #38bdf8; font-weight: 700; text-align: center; margin-top: 4px; }
    
    /* Вікно камери вгорі */
    .camera-container { position: relative; width: 100%; height: 210px; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 6px 20px rgba(0,0,0,0.6); }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    /* Приціл ROI (45x45px) */
    .roi-target { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 45px; height: 45px; border: 2px stroke #ef4444; border-radius: 6px; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; transition: border-color 0.1s; }
    .roi-target.active { border-color: #22c55e; box-shadow: 0 0 16px #22c55e, 0 0 0 9999px rgba(0, 0, 0, 0.5); }
    
    .controls { width: 100%; display: flex; flex-direction: column; gap: 14px; }
    
    .btn-start { background: #0284c7; color: white; border: none; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; }
    .btn-start:active { background: #0369a1; }

    /* Блок вибору імпульсів */
    .preset-group { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: #1e293b; padding: 10px 12px; border-radius: 12px; border: 1px solid #334155; }
    .preset-label { font-size: 0.95rem; color: #94a3b8; font-weight: 500; }
    .preset-btns { display: flex; gap: 6px; }
    .btn-preset { background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-preset.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
    .imp-input { background: #0f172a; border: 1px solid #334155; color: #fff; padding: 8px; border-radius: 8px; width: 85px; text-align: right; font-size: 1rem; font-weight: bold; }

    /* Повзунки з великими відступами */
    .slider-group { display: flex; flex-direction: column; gap: 6px; background: #1e293b; padding: 12px; border-radius: 12px; border: 1px solid #334155; }
    .slider-header { display: flex; justify-content: space-between; font-size: 0.95rem; color: #94a3b8; font-weight: 500; }
    .slider-val { font-weight: bold; color: #38bdf8; }
    input[type=range] { width: 100%; height: 8px; accent-color: #38bdf8; cursor: pointer; margin-top: 4px; }
    input[type=range]:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Дашборд результатів */
    .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: #1e293b; padding: 12px; border-radius: 12px; text-align: center; border: 1px solid #334155; }
    .card-title { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; font-weight: 600; }
    .card-value { font-size: 1.4rem; font-weight: bold; color: #38bdf8; }
    .card-value.highlight { color: #4ade80; }
    .card-subtext { font-size: 0.75rem; color: #64748b; margin-top: 2px; }

    /* Кнопка Reset */
    .btn-reset { background: #334155; color: #cbd5e1; font-size: 1rem; font-weight: 600; padding: 12px; border: none; border-radius: 12px; cursor: pointer; margin-top: 2px; }
    .btn-reset:active { background: #475569; color: #fff; }
    
    canvas { display: none; }
  </style>
</head>
<body>

  <h1>Watt-counter</h1>

  <div class="camera-container">
    <video id="webcam" autoplay playsinline muted></video>
    <div id="roi" class="roi-target"></div>
  </div>

  <div class="controls">
    <button id="start-btn" class="btn-start">Увімкнути камеру</button>

    <div class="preset-group">
      <span class="preset-label">Imp/кВт·год:</span>
      <div class="preset-btns">
        <button type="button" class="btn-preset" onclick="setImp(3200, this)">3200</button>
        <button type="button" class="btn-preset active" onclick="setImp(6400, this)">6400</button>
      </div>
      <input type="number" id="imp-constant" class="imp-input" value="6400">
    </div>

    <!-- Експозиція -->
    <div class="slider-group">
      <div class="slider-header">
        <span>Експозиція:</span>
        <span id="exposure-val" class="slider-val">-1.0 EV</span>
      </div>
      <input type="range" id="exposure-input" min="-2.0" max="2.0" step="0.1" value="-1.0" disabled>
    </div>

    <!-- Поріг спалаху -->
    <div class="slider-group">
      <div class="slider-header">
        <span>Поріг спалаху:</span>
        <span id="threshold-val" class="slider-val">25%</span>
      </div>
      <input type="range" id="threshold-input" min="5" max="100" step="5" value="25">
    </div>

    <div class="dashboard">
      <div class="card">
        <div class="card-title">Поточне навантаження</div>
        <div id="power-val" class="card-value highlight">0.00 кВт</div>
        <div id="fps-val" class="card-subtext">Камера: -- FPS</div>
      </div>
      <div class="card">
        <div class="card-title">Інтервал / Блимання</div>
        <div id="interval-val" class="card-value">0.00 с</div>
      </div>
    </div>

    <button id="reset-btn" class="btn-reset">Reset</button>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const roi = document.getElementById('roi');
    const startBtn = document.getElementById('start-btn');
    const resetBtn = document.getElementById('reset-btn');
    const powerVal = document.getElementById('power-val');
    const intervalVal = document.getElementById('interval-val');
    const fpsVal = document.getElementById('fps-val');
    const impConstantInput = document.getElementById('imp-constant');
    const thresholdInput = document.getElementById('threshold-input');
    const thresholdVal = document.getElementById('threshold-val');
    const exposureInput = document.getElementById('exposure-input');
    const exposureVal = document.getElementById('exposure-val');

    let isTracking = false;
    let lastFlashTime = 0;
    let baseLuminance = 0;
    let isLedOn = false;
    let flashCount = 0;
    let videoTrack = null;

    // Лічильник FPS
    let frameCounter = 0;
    let lastFpsTime = performance.now();

    thresholdInput.addEventListener('input', (e) => {
      thresholdVal.innerText = `${e.target.value}%`;
    });

    function setImp(val, btn) {
      impConstantInput.value = val;
      document.querySelectorAll('.btn-preset').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    startBtn.addEventListener('click', async () => {
      // Запит камери з ідеальною частотою 60 FPS
      const constraints = {
        video: {
          facingMode: { exact: 'environment' },
          frameRate: { ideal: 60, min: 30 }
        }
      };

      try {
        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
        } catch {
          // Фолбек для вебкамер ПК або стандартного режиму
          stream = await navigator.mediaDevices.getUserMedia({
            video: { frameRate: { ideal: 60, min: 30 } }
          });
        }

        video.srcObject = stream;
        startBtn.style.display = 'none';

        videoTrack = stream.getVideoTracks()[0];
        setupExposureControl();

        video.onloadedmetadata = () => {
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          isTracking = true;
          requestAnimationFrame(processFrame);
        };
      } catch (err) {
        alert('Помилка доступу до камери: ' + err.message);
      }
    });

    function setupExposureControl() {
      if (!videoTrack || typeof videoTrack.getCapabilities !== 'function') {
        exposureVal.innerText = '(не підтрим.)';
        return;
      }

      const capabilities = videoTrack.getCapabilities();

      if (capabilities.exposureCompensation) {
        exposureInput.disabled = false;
        exposureInput.min = capabilities.exposureCompensation.min;
        exposureInput.max = capabilities.exposureCompensation.max;
        exposureInput.step = 0.1;
        
        const initialVal = Math.max(capabilities.exposureCompensation.min, -1.0);
        const roundedInitial = Number(initialVal).toFixed(1);
        
        exposureInput.value = roundedInitial;
        exposureVal.innerText = `${roundedInitial > 0 ? '+' : ''}${roundedInitial} EV`;

        applyExposure(parseFloat(roundedInitial));

        exposureInput.addEventListener('input', (e) => {
          const val = parseFloat(e.target.value).toFixed(1);
          exposureVal.innerText = `${val > 0 ? '+' : ''}${val} EV`;
          applyExposure(parseFloat(val));
        });
      } else {
        exposureVal.innerText = '(не підтрим.)';
      }
    }

    function applyExposure(value) {
      if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
        videoTrack.applyConstraints({
          advanced: [{ exposureCompensation: value }]
        }).catch(err => console.log('Exposure error:', err));
      }
    }

    resetBtn.addEventListener('click', () => {
      flashCount = 0;
      lastFlashTime = 0;
      powerVal.innerText = '0.00 кВт';
      intervalVal.innerText = '0.00 с';
    });

    function processFrame() {
      if (!isTracking) return;

      // Підрахунок реальних FPS
      frameCounter++;
      const nowFps = performance.now();
      if (nowFps - lastFpsTime >= 1000) {
        fpsVal.innerText = `Камера: ${frameCounter} FPS`;
        frameCounter = 0;
        lastFpsTime = nowFps;
      }

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const roiSize = 45;
      const startX = (canvas.width - roiSize) / 2;
      const startY = (canvas.height - roiSize) / 2;

      const frameData = ctx.getImageData(startX, startY, roiSize, roiSize).data;
      
      let totalLuminance = 0;
      const pixelCount = frameData.length / 4;

      for (let i = 0; i < frameData.length; i += 4) {
        const r = frameData[i];
        const g = frameData[i + 1];
        const b = frameData[i + 2];
        totalLuminance += (0.5 * r + 0.5 * g);
      }

      const currentLuminance = totalLuminance / pixelCount;

      if (!isLedOn) {
        baseLuminance = baseLuminance * 0.92 + currentLuminance * 0.08;
      }

      const thresholdPercentage = parseFloat(thresholdInput.value) / 100;
      const triggerThreshold = baseLuminance * (1 + thresholdPercentage) + 8;

      if (currentLuminance > triggerThreshold && !isLedOn) {
        isLedOn = true;
        roi.classList.add('active');
        handleFlash();
      } else if (currentLuminance < triggerThreshold && isLedOn) {
        isLedOn = false;
        roi.classList.remove('active');
      }

      requestAnimationFrame(processFrame);
    }

    function handleFlash() {
      const now = performance.now();
      flashCount++;

      if (lastFlashTime > 0) {
        const deltaSeconds = (now - lastFlashTime) / 1000;
        const impConstant = parseFloat(impConstantInput.value) || 6400;

        const powerkW = 3600 / (impConstant * deltaSeconds);
        const powerW = powerkW * 1000;

        intervalVal.innerText = `${deltaSeconds.toFixed(2)} с (#${flashCount})`;
        
        if (powerkW >= 1) {
          powerVal.innerText = `${powerkW.toFixed(2)} кВт`;
        } else {
          powerVal.innerText = `${Math.round(powerW)} Вт`;
        }
      } else {
        intervalVal.innerText = `Чекаємо 2-й спалах... (#1)`;
      }

      lastFlashTime = now;
    }
  </script>
</body>
</html>
